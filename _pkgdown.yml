    - applications_transform
    - applications_bind_years
    - applications_track_classrooms
    - applications_export_csv
    - applications_export_excel
    - applications_export_parquet
    - applications_export_rds
    - applications_export_stata
    - linkage_applications_classroom
    - db_write_applications_master
    - db_read_applications_master
    - db_write_applications_panel
    - db_read_applications_panel
    - alprek_applications_status_codes
    - alprek_applications_funding_types
