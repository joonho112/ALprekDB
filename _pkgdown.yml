url: https://joonho112.github.io/ALprekDB/

template:
  bootstrap: 5
  bootswatch: flatly
  bslib:
    pkgdown-nav-height: 80px

home:
  title: ALprekDB
  description: >
    Processing engine for Alabama First Class Pre-K administrative data:
    validated budget, classroom, and student panels; cross-module linkage;
    DuckDB storage; and privacy-conscious synthetic and private real-data
    workflows.
  sidebar:
    structure: [links, license, community, authors, dev]
  links:
  - text: Synthetic quick start
    href: articles/a1-getting-started.html
  - text: Private targets workflow
    href: articles/a5-targets-workflow.html
  - text: Privacy and provenance
    href: articles/m4-privacy-provenance.html
  - text: Function reference
    href: reference/index.html

navbar:
  structure:
    left: [intro, reference, articles, news, paper]
    right: [search, github]
  components:
    intro:
      text: Get started
      href: articles/a1-getting-started.html
    articles:
      text: Vignettes
      menu:
      - text: '--- Applied Track ---'
      - text: A1 - Getting started
        href: articles/a1-getting-started.html
      - text: A2 - Build panels
        href: articles/a2-build-panels.html
      - text: A3 - Linkage analysis
        href: articles/a3-linkage-analysis.html
      - text: A4 - DuckDB and SQL
        href: articles/a4-duckdb-sql.html
      - text: A5 - Targets workflow
        href: articles/a5-targets-workflow.html
      - text: '--- Methodological Track ---'
      - text: M1 - Architecture trilemma
        href: articles/m1-architecture-trilemma.html
      - text: M2 - Validation framework
        href: articles/m2-validation-framework.html
      - text: M3 - Codebooks and mappings
        href: articles/m3-codebooks-mappings.html
      - text: M4 - Privacy and provenance
        href: articles/m4-privacy-provenance.html
    paper:
      text: "Paper"
      icon: fa-file-pdf
      href: manuscript.pdf
    github:
      icon: fa-github
      href: https://github.com/joonho112/ALprekDB
      aria-label: GitHub

footer:
  structure:
    left: developed_by
    right: built_with

authors:
  JoonHo Lee:
    href: https://orcid.org/0009-0006-4019-8703

articles:
  - title: Applied Track
    desc: >
      Workflow-oriented guides for installing the package, building panels,
      linking modules, querying DuckDB outputs, and running the companion
      targets workflow with synthetic examples and private real-data recipes.
    navbar: ~
    contents:
    - a1-getting-started
    - a2-build-panels
    - a3-linkage-analysis
    - a4-duckdb-sql
    - a5-targets-workflow

  - title: Methodological Track
    desc: >
      Technical and design-oriented articles about the package architecture,
      validation framework, codebook and mapping contracts, privacy controls,
      provenance, and reproducibility posture.
    navbar: ~
    contents:
    - m1-architecture-trilemma
    - m2-validation-framework
    - m3-codebooks-mappings
    - m4-privacy-provenance

reference:
  - title: Budget Module
    desc: Reading, cleaning, validation, transformation, panels, diagnostics, and exports
    contents:
    - budget_config
    - budget_read
    - budget_detect_format
    - budget_clean
    - budget_validate
    - budget_transform
    - budget_to_long
    - budget_bind_years
    - budget_process
    - budget_process_years
    - budget_track_classrooms
    - budget_yoy_summary
    - budget_summary_stats
    - budget_export_csv
    - budget_export_excel
    - budget_export_parquet
    - budget_export_rds
    - budget_export_stata

  - title: Classroom Module
    desc: Reading, cleaning, validation, panels, tracking, summaries, and exports
    contents:
    - classroom_config
    - classroom_read
    - classroom_detect_format
    - classroom_clean
    - classroom_validate
    - classroom_bind_years
    - classroom_process
    - classroom_process_years
    - classroom_track
    - classroom_summary_stats
    - classroom_export_csv
    - classroom_export_excel
    - classroom_export_parquet
    - classroom_export_rds
    - classroom_export_stata

  - title: Student Module
    desc: Reading, cleaning, validation, analytic transforms, panels, summaries, and exports
    contents:
    - student_config
    - student_read
    - student_detect_format
    - student_clean
    - student_validate
    - student_transform
    - student_bind_years
    - student_process
    - student_process_years
    - student_track
    - student_summary_stats
    - student_export_csv
    - student_export_excel
    - student_export_parquet
    - student_export_rds
    - student_export_stata

