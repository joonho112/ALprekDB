    - alprek_applications_capacity_map
    - alprek_synthetic_applications
    - alprek_file_hash
    - alprek_git_sha
    - alprek_provenance_record

  - title: Geocode Module (v0.8.0)
    desc: >
      Reading, format detection and delivery comparison, cleaning,
      validation (codebook-driven RESULTCODE / STATUSCODE checks),
      reconciliation against ADECE coordinates with a documented
      decision matrix, derived variables (including `coord_model_status`),
      multi-run panel binding, 5-format export plus a dedicated
      follow-up-queue exporter, classroom and applications linkage,
      DuckDB persistence, and Melissa.com codebook loaders. In-scope:
      commercial-grade single-source geocoding integration. Out-of-scope
      (planned downstream releases): multi-source consensus, ACS
      area-weighted aggregation, OSRM isochrone, Bayesian small-area
      estimation, live geocoding API.
    contents:
    - geocode_config
    - geocode_read
    - geocode_detect_format
    - geocode_compare_deliveries
    - geocode_clean
    - geocode_validate
    - geocode_reconcile
    - geocode_followup_queue
    - geocode_transform
    - geocode_bind_years
    - geocode_export_csv
    - geocode_export_parquet
    - geocode_export_excel
    - geocode_export_rds
    - geocode_export_stata
