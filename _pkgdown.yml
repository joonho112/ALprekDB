  - title: Applications Module (v0.7.0)
    desc: >
      Reading, format detection, cleaning, fuzzy 4-bucket reconciliation,
      validation (18 base checks plus linkage checks), derived variables, multi-cycle panel
      binding, and 5-format export for ADECE annual classroom
      applications workbooks. In-scope: data-contract layer only.
      Out-of-scope (planned downstream packages): geocoding, ACS
      integration, Bayesian SAE tier estimation.
    contents:
    - applications_config
    - applications_read_renewals
    - applications_read_new
    - applications_read_nonrenewal
    - applications_read_capacity
    - applications_detect_format
    - applications_clean
    - applications_reconcile
