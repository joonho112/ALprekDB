    - db_write_year
    - db_read_panel
    - db_read_master
    - db_list_tables
    - db_table_info
    - db_query
    - db_close

  - title: Codebooks & Mappings
    desc: Data-driven reference tables
    contents:
    - alprek_category_groups
    - alprek_delivery_types
    - alprek_county_codes
    - alprek_degree_patterns
    - alprek_race_mapping
    - alprek_language_mapping
    - alprek_student_race_mapping
